    let db = null;
    try {
      firebase.initializeApp(firebaseConfig);

    // Shim: window.storage backed by Firestore for cloud keys, localStorage for the rest

      get: (key) => {
        if (db && CLOUD_KEYS.has(key)) {
          return db.collection('yatzy').doc(key).get()
            .then((doc) => doc.exists ? { key, value: doc.data().value } : null)

      set: (key, value) => {
        if (db && CLOUD_KEYS.has(key)) {
          return db.collection('yatzy').doc(key).set({ value })
            .then(() => ({ key, value }))
            .catch(() => null);
        }
        return Promise.resolve((() => { try { localStorage.setItem(key, value); return { key, value }; } catch { return null; } })());
      },
      delete: (key) => {
        if (db && CLOUD_KEYS.has(key)) {

            .catch(() => null);
        }

    };
